name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Wait for branch-based Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..24}; do
            status="$(gh api \
              "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&event=dynamic&per_page=1" \
              --jq '.workflow_runs[0].status // ""')"

            if [[ "$status" == "completed" ]]; then
              exit 0
            fi

            if [[ -z "$status" && "$attempt" -ge 8 ]]; then
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for the branch-based Pages deployment." >&2
          exit 1

      - name: Build
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
